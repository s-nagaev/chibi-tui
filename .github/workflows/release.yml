name: Release

# Release: build per-platform binary archives and attach them (+ SHA256SUMS.txt)
# to the published GitHub Release, then publish the crate to crates.io.
# workflow_dispatch acts as a smoke path — artifacts are produced and
# summarized, but nothing is attached to a release and nothing is published.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: "Release: ${{ matrix.leg }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 for broader glibc compatibility of the produced binary.
          - leg: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            checksum_cmd: sha256sum
          - leg: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
            # macOS has no GNU sha256sum binary.
            checksum_cmd: shasum -a 256
          # Intel macOS binary is cross-compiled on the ARM runner:
          # the Xcode/Apple SDK toolchain links both architectures.
          - leg: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            checksum_cmd: shasum -a 256
          - leg: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          # Sane fallback for non-tag refs (e.g. workflow_dispatch on a branch).
          if [[ -z "$VERSION" || "$VERSION" == */* ]]; then
            VERSION="0.0.0-dev-${GITHUB_SHA:0:7}"
          fi
          ARCHIVE="chibi-tui-${VERSION}-${{ matrix.target }}.tar.gz"
          STAGE="pkg/chibi-tui-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/chibi-tui" "$STAGE/chibi-tui"
          cp README.md LICENSE "$STAGE/"
          tar -C "$STAGE" -czf "$ARCHIVE" chibi-tui README.md LICENSE
          ${{ matrix.checksum_cmd }} "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.release.tag_name || github.ref_name }}"
          $version = $rawTag -replace '^v', ''
          # Sane fallback for non-tag refs (e.g. workflow_dispatch on a branch).
          if ([string]::IsNullOrEmpty($version) -or $version -match '/') {
            $version = "0.0.0-dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          $archive = "chibi-tui-$version-${{ matrix.target }}.zip"
          $stage = "pkg/chibi-tui-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/chibi-tui.exe" -Destination "$stage/chibi-tui.exe"
          Copy-Item README.md -Destination $stage
          Copy-Item LICENSE -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Set-Content -Path "$archive.sha256"

      - name: Upload per-leg artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: chibi-tui-*
          if-no-files-found: error

  finalize:
    name: "Release: Finalize"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download per-leg artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS.txt
        run: |
          cd dist
          # Per-leg .sha256 files already contain "<sha256>  <archive-filename>".
          # sed strips a trailing CR (Windows pwsh writes CRLF) so every line is
          # strictly "<sha256>  <archive-filename>".
          sed 's/\r$//' ./*.sha256 > SHA256SUMS.txt
          {
            echo "### SHA256SUMS.txt"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Dispatch smoke summary (no attach)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch run — artifacts built, nothing attached to a release."
          ls -la dist

  publish:
    name: "Release: Publish to crates.io"
    # Publish only on a real release; a manual workflow_dispatch run is a smoke
    # path and never touches crates.io.
    if: github.event_name == 'release'
    # All 4 build legs (the `build` matrix) plus the finalize job must have
    # succeeded: publish only when the whole release pipeline is green.
    needs: [build, finalize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ci.yml gates may never have run for the tagged commit (tags skip
      # branch-push/PR triggers) — re-verify before anything touches crates.io.
      # First guard the tag/manifest version match, then the crates.io
      # idempotency check (a plain rerun of cargo publish hard-fails with
      # "already uploaded").
      - name: Version + idempotency guards
        id: guard
        run: |
          RAW_TAG="${{ github.event.release.tag_name }}"
          VERSION="${RAW_TAG#v}"
          MANIFEST_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chibi-tui") | .version')"
          if [[ -z "$MANIFEST_VERSION" ]]; then
            echo "::error::Could not read the chibi-tui version from Cargo.toml (cargo metadata failed)."
            exit 1
          fi
          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Tag/manifest version drift: release tag '${RAW_TAG}' implies version '${VERSION}', but Cargo.toml declares '${MANIFEST_VERSION}'. Align them and re-create the release."
            exit 1
          fi

          # Skip publishing when this exact version is already on crates.io.
          CRATE_JSON="$(curl -fsSL \
            -H 'User-Agent: chibi-tui-release-ci (github.com/s-nagaev/chibi-tui)' \
            https://crates.io/api/v1/crates/chibi-tui)" || CRATE_JSON=""
          if [[ -z "$CRATE_JSON" ]]; then
            echo "No existing chibi-tui crate on crates.io (or the API was unreachable) — will publish ${VERSION}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAX_VERSION="$(printf '%s' "$CRATE_JSON" | jq -r '.crate.max_version // ""')"
          MAX_STABLE="$(printf '%s' "$CRATE_JSON" | jq -r '.crate.max_stable_version // ""')"
          # Membership check covers re-runs where the tag version is no longer
          # the crate's max (a newer version shipped in between — cargo publish
          # would still hard-fail with "already uploaded").
          EXISTS="$(printf '%s' "$CRATE_JSON" | jq -r --arg v "$VERSION" 'any(.versions[]?; .num == $v)')"
          if [[ "$MAX_VERSION" == "$VERSION" || "$MAX_STABLE" == "$VERSION" || "$EXISTS" == "true" ]]; then
            echo "already published, skipping (crates.io max_version=${MAX_VERSION}, max_stable_version=${MAX_STABLE}; tag implies ${VERSION})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "crates.io max_version=${MAX_VERSION} != tag version ${VERSION} — will publish."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Tests (quality re-verification)
        if: steps.guard.outputs.skip != 'true'
        run: cargo test --locked

      - name: Package
        if: steps.guard.outputs.skip != 'true'
        run: cargo package --locked

      - name: Publish
        if: steps.guard.outputs.skip != 'true'
        # Token reaches cargo via the environment only — never argv, never logs.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
