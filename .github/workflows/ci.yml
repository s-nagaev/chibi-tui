name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linters:
    name: "Quality Gate: Linters"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Docs gate — same flags the workflow used before the split.
      - name: Docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  tests:
    name: "Quality Gate: Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

  # This job builds the SAME unified image as the backend repository's
  # docker-full job — tag collisions are intentional (either source yields
  # the image).
  docker-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            pysergio/chibi
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,prefix=full-
            type=ref,event=pr,prefix=full-
            type=semver,pattern={{version}},prefix=full-
            type=semver,pattern={{major}}.{{minor}},prefix=full-
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: full.Dockerfile
          # The backend source is the public chibi repository.
          build-contexts: |
            backend-src=https://github.com/s-nagaev/chibi
          # amd64 only for now: multiarch full images (QEMU rust cross-build of the TUI) are a follow-up decision.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=pysergio/chibi:full-buildcache
          cache-to: ${{ github.event_name != 'pull_request' && 'type=registry,ref=pysergio/chibi:full-buildcache,mode=max' || '' }}
