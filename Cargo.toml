[package]
name = "chibi-tui"
version = "0.2.0"
edition = "2021"
description = "Terminal UI client for Chibi — an AI assistant (IDE protocol v1 over stdio)"
license = "MIT"
repository = "https://github.com/s-nagaev/chibi-tui"
readme = "README.md"
keywords = ["terminal", "tui", "ai-agent", "llm", "chat"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", "tests/", "full.Dockerfile", "Taskfile.yml", "AGENTS.md", "CHANGELOG.md", "dist/"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
pulldown-cmark = "0.13"
tui-textarea = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "default-syntaxes",
    "default-themes",
    "dump-load",
    "plist-load",
] }
unicode-width = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# System clipboard access for paste into the input field (Ctrl+V / Cmd+V).
arboard = "3.6"

# CLI parsing for the demo binary (`--workspace`).
clap = { version = "4", features = ["derive"] }
uuid = { version = "1.25.0", features = ["v4"] }
dirs = "6.0.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
